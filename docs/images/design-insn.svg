<g font-weight="600" font-size="13" text-anchor="end">
<text x="94" y="53">literal</text><text x="94" y="99">jump</text><text x="94" y="145">0branch</text>
<text x="94" y="191">call</text><text x="94" y="237">ALU</text>
</g>
<g text-anchor="middle">
<text x="126" y="53">1</text>
<text x="478" y="53">value 0 .. 32767 (pushed on the data stack; the old T goes into N)</text>
<text x="170" y="99">000</text>
<text x="522" y="99">target word address (byte address / 2), 0 .. 8191</text>
<text x="170" y="145">001</text>
<text x="522" y="145">target if T = 0 (pops T in any case)</text>
<text x="170" y="191">010</text>
<text x="522" y="191">target; R ← byte address of the next instruction</text>
<text x="170" y="237">011</text>
<text x="258" y="237" font-size="9">R2P</text>
<text x="390" y="237">op (new T)</text>
<text x="522" y="237" font-size="9">T2N</text>
<text x="566" y="237" font-size="9">N2M</text>
<text x="610" y="237" font-size="9">BYTE</text>
<text x="676" y="237">rd</text>
<text x="764" y="237">dd</text>
</g>
<text x="104" y="274" fill="#333">R2P: return (PC ← R &gt;&gt; 1) · op: new T (25 functions) · T2N: old T into N · N2M: store N at [T] · BYTE: byte store</text>
<text x="104" y="291" fill="#333">rd, dd: return and data stack deltas (00 = 0, 01 = +1, 11 = −1, 10 = −2); rd = +1 pushes T, dd = +1 pushes the old T</text>
<text x="104" y="308" fill="#333">Examples: dup = 6001 · drop = 6083 · swap = 60C0 · + = 6103 · @ = 6680 · exit = 700C · ! = 60A3 followed by 6083</text>
</svg>
