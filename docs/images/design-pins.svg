<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 345" font-family="Segoe UI, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#23476b"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#23476b;stroke-width:1.2}
      .pp{fill:#fff4e0;stroke:#b36b00;stroke-width:1.2}
      .od{fill:#f3f8ef;stroke:#3d7a2a;stroke-width:1.2}
      .g{fill:#eef3f9;stroke:#1f5f99;stroke-width:1.2}
      .t{font-weight:600;font-size:12px}
      .s{font-size:11px;fill:#333}
      .f{font-family:Consolas,monospace;font-size:11px}
      .ln{stroke:#23476b;stroke-width:1.3;fill:none}
    </style>
  </defs>
  <rect width="820" height="345" fill="#fff"/>

  <rect class="g" x="20" y="20" width="210" height="70" rx="4"/>
  <text class="t" x="125" y="40" text-anchor="middle">GPIO (output, high, low …)</text>
  <text class="f" x="125" y="58" text-anchor="middle">pin_out[31:0] latch</text>
  <text class="f" x="125" y="74" text-anchor="middle">pin_dir[31:0] 1 = output</text>

  <rect class="pp" x="20" y="104" width="210" height="84" rx="4"/>
  <text class="t" x="125" y="124" text-anchor="middle">PWM channels 0..3</text>
  <text class="s" x="125" y="142" text-anchor="middle">each: enable (control bit 15),</text>
  <text class="s" x="125" y="158" text-anchor="middle">level, 6-bit pin number</text>
  <text class="s" x="125" y="174" text-anchor="middle">48 MHz clock, 32-bit period</text>

  <rect class="pp" x="20" y="202" width="210" height="84" rx="4"/>
  <text class="t" x="125" y="222" text-anchor="middle">DDS</text>
  <text class="s" x="125" y="240" text-anchor="middle">enable (bit 15), 6-bit pin</text>
  <text class="s" x="125" y="256" text-anchor="middle">level = phase bit 31</text>
  <text class="s" x="125" y="272" text-anchor="middle">on the 192 MHz clock</text>

  <rect class="box" x="270" y="40" width="320" height="246" rx="4"/>
  <text class="t" x="430" y="62" text-anchor="middle">pin router (max1000_forth.v), per pin p</text>
  <text class="f" x="284" y="90">owns[p]  = a PWM channel on with pin p,</text>
  <text class="f" x="284" y="106">           or the DDS on with pin p</text>
  <text class="f" x="284" y="122">value[p] = OR of their levels</text>
  <text class="f" x="284" y="146">drive[p] = (pin_dir[p] | owns[p])</text>
  <text class="f" x="284" y="162">           &amp; PIN_EXISTS[p]</text>
  <text class="f" x="284" y="186">level[p] = owns[p] ? value[p]</text>
  <text class="f" x="284" y="202">                   : pin_out[p]</text>
  <text class="s" x="284" y="230">No arbitration: several owners of one pin</text>
  <text class="s" x="284" y="246">are ORed. Disabled, a pin returns to its</text>
  <text class="s" x="284" y="262">latch and direction. PIN_EXISTS = 00FF7FFF.</text>

  <rect class="box" x="630" y="40" width="170" height="110" rx="4"/>
  <text class="t" x="715" y="60" text-anchor="middle">pads</text>
  <text class="s" x="715" y="80" text-anchor="middle">pins 0..14 = D0..D14</text>
  <text class="s" x="715" y="96" text-anchor="middle">pins 16..23 = PIO1..PIO8</text>
  <text class="s" x="715" y="112" text-anchor="middle">15, 24..31 do not exist</text>
  <text class="s" x="715" y="128" text-anchor="middle">drive ? level : Z</text>

  <rect class="g" x="630" y="176" width="170" height="110" rx="4"/>
  <text class="t" x="715" y="196" text-anchor="middle">inputs</text>
  <text class="s" x="715" y="214" text-anchor="middle">2 flip-flops: pin_sync</text>
  <text class="s" x="715" y="230" text-anchor="middle">→ levels at 8010, 8018</text>
  <text class="s" x="715" y="246" text-anchor="middle">pin@ and the board view</text>
  <text class="s" x="715" y="262" text-anchor="middle">driven pins read back</text>

  <path class="ln" d="M230,55 L268,55" marker-end="url(#a)"/>
  <path class="ln" d="M230,146 L268,146" marker-end="url(#a)"/>
  <path class="ln" d="M230,244 L268,244" marker-end="url(#a)"/>
  <path class="ln" d="M590,95 L628,95" marker-end="url(#a)"/>
  <path class="ln" d="M715,150 L715,174" marker-end="url(#a)"/>

  <text class="s" x="20" y="314">Pull-ups: none by default; scripts/build.ps1 -PullUps sets weak pull-ups on D0..D14 and PIO1..PIO8 in the configuration.</text>
  <text class="s" x="20" y="331">Unused FPGA pins are reserved as inputs with weak pull-ups (RESERVE_ALL_UNUSED_PINS_WEAK_PULLUP in scripts/build.tcl).</text>
</svg>
