<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 462" font-family="Segoe UI, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#23476b"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#23476b;stroke-width:1.2}
      .pp{fill:#fff4e0;stroke:#b36b00;stroke-width:1.2}
      .od{fill:#f3f8ef;stroke:#3d7a2a;stroke-width:1.2}
      .g{fill:#eef3f9;stroke:#1f5f99;stroke-width:1.2}
      .t{font-weight:600;font-size:12px}
      .s{font-size:11px;fill:#333}
      .f{font-family:Consolas,monospace;font-size:11px;white-space:pre}
      .ln{stroke:#23476b;stroke-width:1.3;fill:none}
    </style>
  </defs>
  <rect width="820" height="462" fill="#fff"/>

  <rect class="g" x="20" y="20" width="210" height="62" rx="4"/>
  <text class="t" x="125" y="40" text-anchor="middle">GPIO (output, high, low …)</text>
  <text class="f" x="125" y="58" text-anchor="middle">pin_out[31:0] latch</text>
  <text class="f" x="125" y="74" text-anchor="middle">pin_dir[31:0] 1 = output</text>

  <rect class="pp" x="20" y="94" width="210" height="50" rx="4"/>
  <text class="t" x="125" y="113" text-anchor="middle">PWM channels 0..3</text>
  <text class="s" x="125" y="131" text-anchor="middle">each: enable, level, 6-bit pin</text>

  <rect class="pp" x="20" y="154" width="210" height="50" rx="4"/>
  <text class="t" x="125" y="173" text-anchor="middle">DDS</text>
  <text class="s" x="125" y="191" text-anchor="middle">level = phase bit 31 (192 MHz)</text>

  <rect class="pp" x="20" y="214" width="210" height="50" rx="4"/>
  <text class="t" x="125" y="233" text-anchor="middle">UART 0, 1: TX</text>
  <text class="s" x="125" y="251" text-anchor="middle">push-pull; RX is an input</text>

  <rect class="pp" x="20" y="274" width="210" height="50" rx="4"/>
  <text class="t" x="125" y="293" text-anchor="middle">SPI 0, 1: SCK, MOSI</text>
  <text class="s" x="125" y="311" text-anchor="middle">push-pull; MISO is an input</text>

  <rect class="od" x="20" y="334" width="210" height="50" rx="4"/>
  <text class="t" x="125" y="353" text-anchor="middle">I2C: SCL, SDA</text>
  <text class="s" x="125" y="371" text-anchor="middle">open drain: pulled low or released</text>

  <rect class="box" x="270" y="20" width="320" height="364" rx="4"/>
  <text class="t" x="430" y="42" text-anchor="middle">pin router (max1000_forth.v), per pin p</text>
  <text class="f" x="284" y="68">pp_owns[p]  = a push-pull output on</text>
  <text class="f" x="284" y="84">              with pin p (11 of them)</text>
  <text class="f" x="284" y="100">pp_value[p] = OR of their levels</text>
  <text class="f" x="284" y="120">od_owns[p]  = I2C on, SCL or SDA = p</text>
  <text class="f" x="284" y="136">od_low[p]   = OR of their pull-lows</text>
  <text class="f" x="284" y="156">owned[p] = pp_owns[p] | od_owns[p]</text>
  <text class="f" x="284" y="180">drive[p] = owned[p] ? pp_owns[p]</text>
  <text class="f" x="284" y="196">                    | od_low[p]</text>
  <text class="f" x="284" y="212">                    : pin_dir[p]</text>
  <text class="f" x="284" y="228">           &amp; PIN_EXISTS[p]</text>
  <text class="f" x="284" y="252">level[p] = pp_owns[p] ? pp_value[p]</text>
  <text class="f" x="284" y="268">         : owned[p] ? 0 : pin_out[p]</text>
  <text class="s" x="284" y="300">The hardware ORs several owners of one pin;</text>
  <text class="s" x="284" y="316">the kernel's owner table gives each pin to</text>
  <text class="s" x="284" y="332">one unit. Off, a pin returns to its latch and</text>
  <text class="s" x="284" y="348">direction. PIN_EXISTS = 00FF7FFF.</text>

  <rect class="box" x="630" y="20" width="170" height="104" rx="4"/>
  <text class="t" x="715" y="40" text-anchor="middle">pads</text>
  <text class="s" x="715" y="60" text-anchor="middle">pins 0..14 = D0..D14</text>
  <text class="s" x="715" y="76" text-anchor="middle">pins 16..23 = PIO1..PIO8</text>
  <text class="s" x="715" y="92" text-anchor="middle">15, 24..31 do not exist</text>
  <text class="s" x="715" y="108" text-anchor="middle">drive ? level : Z</text>

  <rect class="g" x="630" y="146" width="170" height="130" rx="4"/>
  <text class="t" x="715" y="166" text-anchor="middle">inputs</text>
  <text class="s" x="715" y="184" text-anchor="middle">2 flip-flops: pin_sync</text>
  <text class="s" x="715" y="200" text-anchor="middle">→ levels at 8010, 8018</text>
  <text class="s" x="715" y="216" text-anchor="middle">→ RX, MISO, SCL, SDA,</text>
  <text class="s" x="715" y="232" text-anchor="middle">each by its 6-bit pin number</text>
  <text class="s" x="715" y="248" text-anchor="middle">pin@ and the board view</text>
  <text class="s" x="715" y="264" text-anchor="middle">driven pins read back</text>

  <rect class="g" x="630" y="292" width="170" height="92" rx="4"/>
  <text class="t" x="715" y="312" text-anchor="middle">drive register</text>
  <text class="s" x="715" y="330" text-anchor="middle">8016, 801E: drive[p],</text>
  <text class="s" x="715" y="346" text-anchor="middle">the pins driven now</text>
  <text class="s" x="715" y="362" text-anchor="middle">→ ports line of board</text>

  <path class="ln" d="M230,51 L268,51" marker-end="url(#a)"/>
  <path class="ln" d="M230,119 L268,119" marker-end="url(#a)"/>
  <path class="ln" d="M230,179 L268,179" marker-end="url(#a)"/>
  <path class="ln" d="M230,239 L268,239" marker-end="url(#a)"/>
  <path class="ln" d="M230,299 L268,299" marker-end="url(#a)"/>
  <path class="ln" d="M230,359 L268,359" marker-end="url(#a)"/>
  <path class="ln" d="M590,72 L628,72" marker-end="url(#a)"/>
  <path class="ln" d="M715,124 L715,144" marker-end="url(#a)"/>
  <path class="ln" d="M590,338 L628,338" marker-end="url(#a)"/>

  <text class="s" x="20" y="412">Pull-ups: none by default; scripts/build.ps1 -PullUps sets weak pull-ups on D0..D14 and PIO1..PIO8 in the configuration.</text>
  <text class="s" x="20" y="429">Unused FPGA pins are reserved as inputs with weak pull-ups (RESERVE_ALL_UNUSED_PINS_WEAK_PULLUP in scripts/build.tcl).</text>
  <text class="s" x="20" y="446">I2C needs pull-up resistors on SCL and SDA; the board has none on its pins.</text>
</svg>
